name: taka
description: A menu bar app for SSH tunnels and SOCKS proxies, through the system's own ssh.

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  bloc: 9.2.1
  core:
    path: packages/core
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  freezed_annotation: 3.1.0

dev_dependencies:
  bloc_test: 10.0.0
  build_runner: 2.16.1
  flutter_launcher_icons: 0.14.4
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  freezed: 4.0.1
  mocktail: 1.0.5

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  macos:
    generate: true
