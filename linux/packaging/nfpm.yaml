# The .deb and .rpm, built by nfpm in build.yml from the release bundle copied
# to build/package/taka. VERSION and ARCH (amd64 or arm64) come from the
# environment; nfpm doesn't expand variables in contents.
name: taka
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Pacabase
vendor: Pacabase
homepage: https://github.com/Pacabase/taka
license: BSD-3-Clause
description: A menu bar app for SSH tunnels and SOCKS proxies, through the system's own ssh.

contents:
  - src: build/package/taka
    dst: /opt/taka
    type: tree
  - src: /opt/taka/taka
    dst: /usr/bin/taka
    type: symlink
  - src: linux/packaging/com.pacabase.taka.desktop
    dst: /usr/share/applications/com.pacabase.taka.desktop
  - src: assets/icon/icon.png
    dst: /usr/share/pixmaps/com.pacabase.taka.png

# The window needs GTK 3, and the helper's tray library also needs libX11 and
# libXi. Taka runs the system's ssh.
overrides:
  deb:
    depends:
      - libgtk-3-0
      - libx11-6
      - libxi6
      - libstdc++6
      - openssh-client
  rpm:
    depends:
      - gtk3
      - libX11
      - libXi
      - libstdc++
      - openssh-clients
