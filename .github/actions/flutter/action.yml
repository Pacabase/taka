name: 'Install Flutter and the packages'
description: 'The Flutter in .fvmrc, and the app and agent packages from their lockfiles.'

runs:
  using: 'composite'
  steps:
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version-file: .fvmrc
        # Flutter publishes no Linux arm64 archive, so there it checks out the release tag from git.
        channel: ${{ runner.os == 'Linux' && runner.arch == 'ARM64' && 'main' || 'stable' }}
        cache: true

    - name: Get the packages
      shell: bash
      run: |
        flutter pub get --enforce-lockfile
        dart pub get --enforce-lockfile -C packages/agent
