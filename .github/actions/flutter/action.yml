name: 'Install Flutter and the packages'
description: 'The Flutter in .fvmrc, and the app and agent packages from their lockfiles.'

runs:
  using: 'composite'
  steps:
    - name: Install FVM
      shell: bash
      run: |
        curl -fsSL https://fvm.app/install.sh | bash -s -- 4.0.5
        echo "$HOME/fvm/bin" >> "$GITHUB_PATH"

    - name: Cache Flutter SDK
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ runner.os }}-${{ runner.arch }}-flutter-${{ hashFiles('.fvmrc') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-flutter-
        path: .fvm/cache

    - name: Install Flutter SDK
      shell: bash
      run: fvm config --cache-path .fvm/cache && fvm install

    - name: Get the packages
      shell: bash
      run: |
        fvm flutter pub get --enforce-lockfile
        fvm dart pub get --enforce-lockfile -C packages/agent
