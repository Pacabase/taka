version: 2
updates:
  - package-ecosystem: 'github-actions'
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: 'pub'
    directories: ['/', '/packages/core', '/packages/agent']
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns: ['*']
