name: Bug report
description: A tunnel doesn't open, drops, or Taka behaves differently than `ssh` does.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Taka version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.1, Ubuntu 24.04, Windows 11 24H2
    validations:
      required: true
  - type: input
    id: ssh
    attributes:
      label: Output of `ssh -V`
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: What Taka showed
      description: The tunnel's error, or the agent's output. Remove host names and user names you don't want to share.
      render: text
