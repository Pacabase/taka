name: Release

# A v* tag drafts a GitHub Release with the .dmg. Run by hand, or on a pull
# request that changes how it's built, it uploads the same files instead.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
    paths: ['.github/workflows/release.yml', 'Makefile']
  workflow_dispatch:

permissions: {}

jobs:
  # Dart builds the agent for the Mac it runs on only, so once per chip.
  agent:
    name: agent (${{ matrix.arch }})
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - arch: arm64
            os: macos-15
          - arch: x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          # The Dart that ships with the Flutter in .fvmrc.
          sdk: 3.13.7
      - run: dart pub get --enforce-lockfile
      - run: dart build cli
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-${{ matrix.arch }}
          path: packages/agent/build/cli/macos_${{ matrix.arch }}/bundle
          if-no-files-found: error

  app:
    needs: agent
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG doesn't match pubspec.yaml's version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-*
          path: agents
      - name: Join the agents into one universal agent
        run: |
          cp -R agents/agent-arm64 agent
          cp packages/agent/assets/*.png agent/
          for file in bin/taka_agent lib/libcnativeapi.dylib; do
            lipo -create "agents/agent-arm64/$file" "agents/agent-x64/$file" -output "agent/$file"
          done
          chmod +x agent/bin/taka_agent
          lipo -archs agent/bin/taka_agent
      - uses: ./.github/actions/flutter
      - run: fvm flutter pub get --enforce-lockfile
      - run: make app AGENT=agent
      - name: Check both chips are in the app
        run: |
          for file in \
            Contents/MacOS/Taka \
            Contents/Library/LoginItems/Taka.app/Contents/MacOS/Taka \
            Contents/Library/LoginItems/Taka.app/Contents/lib/libcnativeapi.dylib; do
            archs=$(lipo -archs "build/macos/Build/Products/Release/Taka.app/$file")
            echo "$file: $archs"
            case "$archs" in *x86_64*arm64*|*arm64*x86_64*) ;; *) exit 1 ;; esac
          done
      - name: Make the disk image
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          mkdir -p dmg dist
          cp -R build/macos/Build/Products/Release/Taka.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Taka -srcfolder dmg -format UDZO -ov "dist/Taka-$version.dmg"
          (cd dist && shasum -a 256 Taka-*.dmg > SHA256SUMS)
          cat dist/SHA256SUMS
      - if: github.ref_type == 'tag'
        name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --draft --generate-notes --title "Taka ${TAG#v}" --repo "$GITHUB_REPOSITORY"
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Taka
          path: dist
          if-no-files-found: error
