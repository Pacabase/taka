name: Release

# A v* tag drafts a GitHub Release with a .dmg per chip. Run by hand, or on a
# pull request that changes how they're built, it uploads the same files.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/actions/flutter/**'
      - '.fvmrc'
      - 'macos/**'
      - 'pubspec.*'
      - 'assets/**'
      - 'fonts/**'
      - 'packages/core/pubspec.*'
      - 'packages/agent/assets/**'
      - 'packages/agent/macos/**'
      - 'packages/agent/pubspec.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Dart builds the agent only for the Mac it runs on, and its runtime can't
  # find the program inside a universal binary, so each chip gets its own app.
  macos:
    name: macos (${{ matrix.chip }})
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - chip: apple-silicon
            os: macos-15
          - chip: intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG doesn't match pubspec.yaml's version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: ./.github/actions/flutter
      - run: fvm flutter pub get --enforce-lockfile
      - run: fvm dart pub get --enforce-lockfile -C packages/agent
      - run: fvm flutter build macos --release
      - run: codesign --verify --deep --strict build/macos/Build/Products/Release/Taka.app
      - name: Make the disk image
        env:
          DMG: Taka-${{ env.VERSION }}-${{ matrix.chip }}.dmg
        run: |
          mkdir -p dmg dist
          cp -R build/macos/Build/Products/Release/Taka.app dmg/
          ln -s /Applications dmg/Applications
          # hdiutil on GitHub's runners sometimes fails with "Resource busy".
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname Taka -srcfolder dmg -format ULMO -ov "dist/$DMG" && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Taka-${{ matrix.chip }}
          path: dist
          if-no-files-found: error

  # Its own job, so the build's tools never run with a token that can write.
  release:
    if: github.ref_type == 'tag'
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Taka-*
          path: dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum Taka-*.dmg > SHA256SUMS)
          if ! draft=$(gh release view "$TAG" --json isDraft -q .isDraft 2>"$RUNNER_TEMP/view"); then
            grep -q "release not found" "$RUNNER_TEMP/view" || { cat "$RUNNER_TEMP/view" >&2; exit 1; }
            gh release create "$TAG" dist/* --verify-tag --draft --generate-notes --title "Taka ${TAG#v}"
          elif [ "$draft" = true ]; then
            gh release upload "$TAG" dist/* --clobber
          else
            echo "$TAG is already published" >&2
            exit 1
          fi
