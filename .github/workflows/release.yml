name: Release

# A v* tag drafts a GitHub Release with a .dmg per chip. Run by hand, or on a
# pull request that changes how they're built, it uploads the same files.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/actions/flutter/**'
      - '.fvmrc'
      - 'Makefile'
      - 'macos/**'
      - 'pubspec.*'
      - 'assets/**'
      - 'fonts/**'
      - 'packages/core/pubspec.*'
      - 'packages/agent/assets/**'
      - 'packages/agent/macos/**'
      - 'packages/agent/pubspec.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: |
          echo "version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"
      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG doesn't match pubspec.yaml's version $VERSION" >&2
            exit 1
          fi

  # Dart can only build the agent for the Mac it runs on, and its runtime can't
  # find the program inside a universal binary, so each chip gets its own app.
  macos:
    name: macos (${{ matrix.chip }})
    needs: version
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - chip: apple-silicon
            arch: arm64
            os: macos-15
          - chip: intel
            arch: x86_64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/flutter
      - run: fvm flutter pub get --enforce-lockfile
      - run: fvm dart pub get --enforce-lockfile -C packages/agent
      - run: make macos
      - name: Check the app runs on this chip and its stated macOS
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          app=build/macos/Build/Products/Release/Taka.app
          agent=$app/Contents/Library/LoginItems/Taka.app
          codesign --verify --deep --strict "$app"
          minimum=$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")
          agent_minimum=$(plutil -extract LSMinimumSystemVersion raw "$agent/Contents/Info.plist")
          if [ "$minimum" != "$agent_minimum" ]; then
            echo "The app says macOS $minimum but its agent says $agent_minimum" >&2
            exit 1
          fi
          find "$app" -type f | while IFS= read -r file; do
            lipo -info "$file" >/dev/null 2>&1 || continue
            needs=$( (vtool -show-build "$file" || true) | awk '/minos/ {print $2}' | sort -V | tail -1)
            echo "${file#"$app"/}: $(lipo -archs "$file"), macOS ${needs:-?}"
            lipo "$file" -verify_arch "$ARCH" || { echo "${file#"$app"/} doesn't run on $ARCH" >&2; exit 1; }
            if [ -z "$needs" ] ||
              [ "$(printf '%s\n%s\n' "$needs" "$minimum" | sort -V | tail -1)" != "$minimum" ]; then
              echo "${file#"$app"/} needs macOS ${needs:-?}, but the app says $minimum" >&2
              exit 1
            fi
          done
      - name: Make the disk image
        env:
          DMG: Taka-${{ needs.version.outputs.version }}-${{ matrix.chip }}.dmg
        run: |
          mkdir -p dmg dist
          cp -R build/macos/Build/Products/Release/Taka.app dmg/
          ln -s /Applications dmg/Applications
          # hdiutil on GitHub's runners sometimes fails with "Resource busy".
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname Taka -srcfolder dmg -format ULMO -ov "dist/$DMG" && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Taka-${{ matrix.chip }}
          path: dist
          if-no-files-found: error

  # Its own job, so the build's tools never run with a token that can write.
  release:
    if: github.ref_type == 'tag'
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Taka-*
          path: dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum Taka-*.dmg > SHA256SUMS)
          if ! draft=$(gh release view "$TAG" --json isDraft -q .isDraft 2>"$RUNNER_TEMP/view"); then
            grep -q "release not found" "$RUNNER_TEMP/view" || { cat "$RUNNER_TEMP/view" >&2; exit 1; }
            gh release create "$TAG" dist/* --verify-tag --draft --generate-notes --title "Taka ${TAG#v}"
          elif [ "$draft" = true ]; then
            gh release upload "$TAG" dist/* --clobber
          else
            echo "$TAG is already published" >&2
            exit 1
          fi
