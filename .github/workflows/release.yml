name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  # Its own job, so the build's tools never run with a token that can write.
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Taka-*
          path: dist
          merge-multiple: true
      - name: Attach the .dmgs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum Taka-*.dmg > SHA256SUMS)
          if ! draft=$(gh release view "$TAG" --json isDraft -q .isDraft 2>"$RUNNER_TEMP/view"); then
            grep -q "release not found" "$RUNNER_TEMP/view" || { cat "$RUNNER_TEMP/view" >&2; exit 1; }
            gh release create "$TAG" dist/* --verify-tag --draft --generate-notes --title "Taka ${TAG#v}"
          elif [ "$draft" = true ]; then
            gh release upload "$TAG" dist/* --clobber
          else
            # A release made on GitHub's website is already published; never
            # replace files people may have downloaded.
            gh release upload "$TAG" dist/*
          fi
