name: Publish

# Publishes a stable release to the stores: one job per store, each with its
# own environment and key. Release calls this for a release published before
# its files were attached; a run by hand from a release's tag repeats one store.
on:
  release:
    types: [published]
  workflow_call:
  workflow_dispatch:
    inputs:
      store:
        description: The store to publish to.
        type: choice
        options: [all, aur]
        default: all

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        name: Check the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != tag ]; then
            echo "::error::Run this from a release tag."
            exit 1
          fi
          version=${TAG#v}
          if ! echo "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::notice::$TAG is a pre-release; the stores get stable releases only."
            exit 0
          fi
          if ! gh release view "$TAG" --json isDraft,isPrerelease,assets > "$RUNNER_TEMP/release.json" 2>"$RUNNER_TEMP/view"; then
            grep -q "release not found" "$RUNNER_TEMP/view" || { cat "$RUNNER_TEMP/view" >&2; exit 1; }
            echo "::notice::$TAG has no published release."
            exit 0
          fi
          if jq -e '.isDraft or .isPrerelease' "$RUNNER_TEMP/release.json" >/dev/null; then
            echo "::notice::$TAG isn't a published, stable release."
            exit 0
          fi
          attached() {
            jq -e --arg file "$1" 'any(.assets[]; .name == $file)' "$RUNNER_TEMP/release.json" >/dev/null
          }
          if ! attached SHA256SUMS; then
            echo "::notice::$TAG has no SHA256SUMS yet; Release publishes once its files are attached."
            exit 0
          fi
          mkdir -p release
          gh release download "$TAG" --pattern SHA256SUMS --dir release
          while read -r _ file; do
            if ! attached "$file"; then
              echo "::notice::$TAG has no $file yet; Release publishes once its files are attached."
              exit 0
            fi
          done < release/SHA256SUMS
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: steps.release.outputs.version
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  # Built and installed from the release's own files, before the key is used.
  aur-package:
    needs: check
    if: needs.check.outputs.version && contains(fromJSON('["", "all", "aur"]'), inputs.store || '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SHA256SUMS
          path: release
      - name: Build and install the package from the release
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          sh linux/packaging/aur/render.sh "$VERSION" release/SHA256SUMS aur
          sh linux/packaging/aur/build.sh aur
          sh linux/packaging/check_install.sh aur
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: taka-bin
          path: |
            aur/PKGBUILD
            aur/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # Its own job, so the AUR key never meets the build's tools.
  aur:
    needs: [check, aur-package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: aur
    concurrency:
      group: aur
      cancel-in-progress: false
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: taka-bin
          path: aur
      - name: Push to the AUR
        env:
          VERSION: ${{ needs.check.outputs.version }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::The aur environment has no AUR_SSH_PRIVATE_KEY secret."
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          # aur.archlinux.org's key, as listed on its home page.
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > "$HOME/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          git clone ssh://aur@aur.archlinux.org/taka-bin.git "$RUNNER_TEMP/taka-bin"
          cp aur/PKGBUILD aur/.SRCINFO "$RUNNER_TEMP/taka-bin/"
          cd "$RUNNER_TEMP/taka-bin"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "::notice::The AUR already has taka-bin $VERSION."
            exit 0
          fi
          git -c user.name=Pacabase -c user.email=taka@pacabase.com commit -m "Taka $VERSION"
          git push origin HEAD:master
