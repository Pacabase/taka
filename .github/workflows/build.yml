name: Build

on:
  workflow_call:
    inputs:
      targets:
        description: The targets to build, as a JSON list; all of them by default.
        type: string
        default: '["macos-apple-silicon", "macos-intel", "linux-x64", "linux-arm64"]'

permissions: {}

jobs:
  # Dart can't build the agent for another chip, nor run it as a universal binary.
  # Linux builds on the oldest Ubuntu runner, so its glibc suits more systems.
  build:
    name: ${{ matrix.target }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    runs-on: >-
      ${{ fromJSON('{
        "macos-apple-silicon": "macos-15",
        "macos-intel": "macos-15-intel",
        "linux-x64": "ubuntu-22.04",
        "linux-arm64": "ubuntu-22.04-arm"
      }')[matrix.target] }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG doesn't match pubspec.yaml's version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev
      - uses: ./.github/actions/flutter
      - run: fvm flutter pub get --enforce-lockfile
      - run: fvm dart pub get --enforce-lockfile -C packages/agent

      - if: runner.os == 'macOS'
        run: fvm flutter build macos --release
      - if: runner.os == 'macOS'
        run: test -x build/macos/Build/Products/Release/Taka.app/Contents/Library/LoginItems/Taka.app/Contents/MacOS/Taka
      - if: runner.os == 'macOS'
        run: codesign --verify --deep --strict build/macos/Build/Products/Release/Taka.app
      - name: Make the disk image
        if: runner.os == 'macOS'
        env:
          DMG: Taka-${{ env.VERSION }}-${{ matrix.target }}.dmg
        run: |
          mkdir -p dmg dist
          cp -R build/macos/Build/Products/Release/Taka.app dmg/
          ln -s /Applications dmg/Applications
          # hdiutil on GitHub's runners sometimes fails with "Resource busy".
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname Taka -srcfolder dmg -format ULMO -ov "dist/$DMG" && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
          done

      - if: runner.os == 'Linux'
        run: fvm flutter build linux --release
      - name: Make the archive
        if: runner.os == 'Linux'
        env:
          ARCH: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          TARBALL: Taka-${{ env.VERSION }}-${{ matrix.target }}.tar.gz
        run: |
          bundle=build/linux/$ARCH/release/bundle
          test -x "$bundle/taka" && test -x "$bundle/agent/bin/taka_agent"
          mkdir -p dist
          tar -czf "dist/$TARBALL" -C "$bundle" --transform 's,^\.,taka,' .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Taka-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 14
