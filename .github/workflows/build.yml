name: Build

on:
  workflow_call:
    inputs:
      targets:
        description: The targets to build, as a JSON list; all of them by default.
        type: string
        default: '["macos-apple-silicon", "macos-intel"]'

permissions: {}

jobs:
  # Dart can't build the agent for another chip, nor run it as a universal binary.
  build:
    name: ${{ matrix.target }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    runs-on: >-
      ${{ fromJSON('{
        "macos-apple-silicon": "macos-15",
        "macos-intel": "macos-15-intel"
      }')[matrix.target] }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG doesn't match pubspec.yaml's version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: ./.github/actions/flutter
      - run: fvm flutter pub get --enforce-lockfile
      - run: fvm dart pub get --enforce-lockfile -C packages/agent
      - run: fvm flutter build macos --release
      - run: test -x build/macos/Build/Products/Release/Taka.app/Contents/Library/LoginItems/Taka.app/Contents/MacOS/Taka
      - run: codesign --verify --deep --strict build/macos/Build/Products/Release/Taka.app
      - name: Make the disk image
        env:
          DMG: Taka-${{ env.VERSION }}-${{ matrix.target }}.dmg
        run: |
          mkdir -p dmg dist
          cp -R build/macos/Build/Products/Release/Taka.app dmg/
          ln -s /Applications dmg/Applications
          # hdiutil on GitHub's runners sometimes fails with "Resource busy".
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname Taka -srcfolder dmg -format ULMO -ov "dist/$DMG" && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Taka-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 14
