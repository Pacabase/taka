name: Build

on:
  workflow_call:
    inputs:
      macos-targets:
        description: The macOS targets to build, as a JSON list; both by default.
        type: string
        default: '["macos-apple-silicon", "macos-intel"]'
      linux-targets:
        description: The Linux targets to build, as a JSON list; both by default.
        type: string
        default: '["linux-x64", "linux-arm64"]'

permissions: {}

# Dart can't build the agent for another chip, nor run it as a universal binary,
# so each chip builds on its own runner.
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG doesn't match pubspec.yaml's version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    name: ${{ matrix.target }}
    needs: version
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.macos-targets) }}
    runs-on: >-
      ${{ fromJSON('{
        "macos-apple-silicon": "macos-15",
        "macos-intel": "macos-15-intel"
      }')[matrix.target] }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/flutter
      - run: fvm flutter build macos --release
      - run: test -x build/macos/Build/Products/Release/Taka.app/Contents/Library/LoginItems/Taka.app/Contents/MacOS/Taka
      - run: codesign --verify --deep --strict build/macos/Build/Products/Release/Taka.app
      - name: Make the disk image
        env:
          DMG: Taka-${{ needs.version.outputs.version }}-${{ matrix.target }}.dmg
        run: |
          mkdir -p dmg dist
          cp -R build/macos/Build/Products/Release/Taka.app dmg/
          ln -s /Applications dmg/Applications
          # hdiutil on GitHub's runners sometimes fails with "Resource busy".
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname Taka -srcfolder dmg -format ULMO -ov "dist/$DMG" && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Taka-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  linux:
    name: ${{ matrix.target }}
    needs: version
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.linux-targets) }}
    # The oldest Ubuntu runner, so the build's glibc suits more systems.
    runs-on: >-
      ${{ fromJSON('{
        "linux-x64": "ubuntu-22.04",
        "linux-arm64": "ubuntu-22.04-arm"
      }')[matrix.target] }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libx11-dev libxi-dev
      - uses: ./.github/actions/flutter
      - run: fvm flutter build linux --release
      - name: Make the archive
        env:
          TARGET: ${{ matrix.target }}
          TARBALL: Taka-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz
        run: |
          release=build/linux/${TARGET#linux-}/release
          test -x "$release/bundle/taka" && test -x "$release/bundle/agent/bin/taka_agent"
          mkdir -p dist
          tar -czf "dist/$TARBALL" -C "$release" --transform 's,^bundle,taka,' bundle
      - name: Make the .deb and .rpm
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
          NFPM: 2.48.0
        run: |
          case "$TARGET" in
            linux-x64) ARCH=amd64 nfpm=x86_64 sum=6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750 ;;
            linux-arm64) ARCH=arm64 nfpm=arm64 sum=a9a75213763783b7669719e505474c748c5ad7dc66591a195619deb50f85c2f4 ;;
            *) echo "No package architecture for $TARGET" >&2; exit 1 ;;
          esac
          curl -fsSLo "$RUNNER_TEMP/nfpm.tar.gz" "https://github.com/goreleaser/nfpm/releases/download/v$NFPM/nfpm_${NFPM}_Linux_$nfpm.tar.gz"
          echo "$sum  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP" nfpm
          export ARCH
          mkdir -p build/package
          cp -R "build/linux/${TARGET#linux-}/release/bundle" build/package/taka
          for packager in deb rpm; do
            "$RUNNER_TEMP/nfpm" package --config linux/packaging/nfpm.yaml --packager "$packager" \
              --target "dist/Taka-$VERSION-$TARGET.$packager"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Taka-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  # A clean system gets every library from the packages' dependencies. Only
  # x64: both chips declare the same ones.
  linux-packages:
    name: install on ${{ matrix.image }}
    if: contains(inputs.linux-targets, 'linux-x64')
    needs: linux
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:22.04, ubuntu:24.04, debian:12, fedora:latest]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Taka-linux-x64
          path: dist
      - run: sh linux/packaging/check_install.sh dist
