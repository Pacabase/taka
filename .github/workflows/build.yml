name: Build

on:
  workflow_call:
    inputs:
      macos-targets:
        description: The macOS targets to build, as a JSON list; both by default.
        type: string
        default: '["macos-apple-silicon", "macos-intel"]'
      linux-targets:
        description: The Linux targets to build, as a JSON list; both by default.
        type: string
        default: '["linux-x64", "linux-arm64"]'
      windows-targets:
        description: The Windows targets to build, as a JSON list.
        type: string
        default: '["windows-x64"]'

permissions: {}

# Dart can't build the agent for another chip, nor run it as a universal binary,
# so each chip builds on its own runner.
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG doesn't match pubspec.yaml's version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    name: ${{ matrix.target }}
    needs: version
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.macos-targets) }}
    runs-on: >-
      ${{ fromJSON('{
        "macos-apple-silicon": "macos-15",
        "macos-intel": "macos-15-intel"
      }')[matrix.target] }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/flutter
      - run: fvm flutter build macos --release
      - name: Make the disk image
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: macos/packaging/make_dmg.sh "$VERSION" "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Taka-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  linux:
    name: ${{ matrix.target }}
    needs: version
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.linux-targets) }}
    # The oldest Ubuntu runner, so the build's glibc suits more systems.
    runs-on: >-
      ${{ fromJSON('{
        "linux-x64": "ubuntu-22.04",
        "linux-arm64": "ubuntu-22.04-arm"
      }')[matrix.target] }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libx11-dev libxi-dev
      - uses: ./.github/actions/flutter
      - run: fvm flutter build linux --release
      - name: Make the archive, .deb and .rpm
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: linux/packaging/package.sh "$VERSION" "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Taka-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  windows:
    name: ${{ matrix.target }}
    needs: version
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.windows-targets) }}
    runs-on: >-
      ${{ fromJSON('{
        "windows-x64": "windows-2025"
      }')[matrix.target] }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/flutter
      - run: fvm flutter build windows --release
      - name: Make the archive and installer
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: ./windows/packaging/package.ps1 $env:VERSION $env:TARGET
      - name: Check the installer
        shell: pwsh
        env:
          SETUP: Taka-${{ needs.version.outputs.version }}-${{ matrix.target }}-setup.exe
        run: |
          $app = "$env:RUNNER_TEMP\installed"
          Start-Process "dist\$env:SETUP" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$app"
          if (-not (Test-Path "$app\taka.exe") -or -not (Test-Path "$app\agent\bin\taka_agent.exe")) {
            throw "The installer didn't install Taka"
          }
          Start-Process "$app\unins000.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          # The uninstaller hands over to a copy of itself and returns at once.
          for ($second = 0; (Test-Path "$app\taka.exe") -and $second -lt 60; $second++) { Start-Sleep 1 }
          if (Test-Path "$app\taka.exe") { throw "The uninstaller left Taka behind" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Taka-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  # A clean system gets every library from the packages' dependencies.
  linux-packages:
    name: ${{ matrix.target }} on ${{ matrix.image }}
    needs: linux
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.linux-targets) }}
        image: [ubuntu:22.04, ubuntu:24.04, debian:12, fedora:latest]
    runs-on: >-
      ${{ fromJSON('{
        "linux-x64": "ubuntu-latest",
        "linux-arm64": "ubuntu-24.04-arm"
      }')[matrix.target] }}
    container: ${{ matrix.image }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Taka-${{ matrix.target }}
          path: dist
      - run: sh linux/packaging/check_install.sh dist
