name: Build

on:
  workflow_call:
    inputs:
      macos-targets:
        description: The macOS targets to build, as a JSON list; both by default.
        type: string
        default: '["macos-apple-silicon", "macos-intel"]'
      linux-targets:
        description: The Linux targets to build, as a JSON list; both by default.
        type: string
        default: '["linux-x64", "linux-arm64"]'

permissions: {}

# Dart can't build the agent for another chip, nor run it as a universal binary,
# so each chip builds on its own runner.
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG doesn't match pubspec.yaml's version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    name: ${{ matrix.target }}
    needs: version
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.macos-targets) }}
    runs-on: >-
      ${{ fromJSON('{
        "macos-apple-silicon": "macos-15",
        "macos-intel": "macos-15-intel"
      }')[matrix.target] }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/flutter
      - run: fvm flutter build macos --release
      - run: test -x build/macos/Build/Products/Release/Taka.app/Contents/Library/LoginItems/Taka.app/Contents/MacOS/Taka
      - run: codesign --verify --deep --strict build/macos/Build/Products/Release/Taka.app
      - uses: ./.github/actions/fastforge
      - name: Make the disk image
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          fastforge --no-version-check package --platform macos --targets dmg --skip-build \
            --output build/packages --artifact-name "Taka-{{build_name}}-$TARGET.{{ext}}"
          mkdir -p dist
          mv build/packages/*/Taka-* dist/
          test -s "dist/Taka-$VERSION-$TARGET.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Taka-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  linux:
    name: ${{ matrix.target }}
    needs: version
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.linux-targets) }}
    # The oldest Ubuntu runner, so the build's glibc suits more systems.
    runs-on: >-
      ${{ fromJSON('{
        "linux-x64": "ubuntu-22.04",
        "linux-arm64": "ubuntu-22.04-arm"
      }')[matrix.target] }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libx11-dev libxi-dev
      - uses: ./.github/actions/flutter
      - run: fvm flutter build linux --release
      - name: Make the archive
        env:
          TARGET: ${{ matrix.target }}
          TARBALL: Taka-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz
        run: |
          release=build/linux/${TARGET#linux-}/release
          test -x "$release/bundle/taka" && test -x "$release/bundle/agent/bin/taka_agent"
          mkdir -p dist
          tar -czf "dist/$TARBALL" -C "$release" --transform 's,^bundle,taka,' bundle
      - uses: ./.github/actions/fastforge
      - name: Make the .deb and .rpm
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sudo apt-get install -y rpm patchelf
          fastforge --no-version-check package --platform linux --targets deb,rpm --skip-build \
            --output build/packages --artifact-name "Taka-{{build_name}}-$TARGET.{{ext}}"
          mv build/packages/*/Taka-* dist/
          test -s "dist/Taka-$VERSION-$TARGET.deb" && test -s "dist/Taka-$VERSION-$TARGET.rpm"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Taka-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  # A clean system gets every library from the packages' dependencies.
  linux-packages:
    name: ${{ matrix.target }} on ${{ matrix.image }}
    needs: linux
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.linux-targets) }}
        image: [ubuntu:22.04, ubuntu:24.04, debian:12, fedora:latest]
    runs-on: >-
      ${{ fromJSON('{
        "linux-x64": "ubuntu-latest",
        "linux-arm64": "ubuntu-24.04-arm"
      }')[matrix.target] }}
    container: ${{ matrix.image }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Taka-${{ matrix.target }}
          path: dist
      - run: sh linux/packaging/check_install.sh dist
